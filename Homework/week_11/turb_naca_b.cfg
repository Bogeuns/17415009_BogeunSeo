%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 configuration file                                                       %
% Case description: Steady RANS NACA4412                                       %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

SOLVER= RANS
KIND_TURB_MODEL= SA
REF_DIMENSIONALIZATION= DIMENSIONAL
MATH_PROBLEM= DIRECT

% FREE-STREAM
MACH_NUMBER= 0.09
AOA= 13.87
FREESTREAM_TEMPERATURE= 293.0
FREESTREAM_PRESSURE= 101325.0
REYNOLDS_NUMBER= 1.52e6
REYNOLDS_LENGTH= 1.0

% REFERENCE VALUES
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0

% BOUNDARY CONDITIONS (Mesh Markers)
% ============================================================
% Mesh markers: Inlet / Outlet / Symmetry / Wall
% ============================================================
MARKER_FAR = ( farfield )
MARKER_SYM = ( symmetry )
MARKER_HEATFLUX = ( farfield, 0.0 )
MARKER_PLOTTING = ( airfoil )
MARKER_MONITORING = ( airfoil )

% SOLVER SETTINGS
NUM_METHOD_GRAD= GREEN_GAUSS
CONV_NUM_METHOD_FLOW= JST
JST_SENSOR_COEFF= ( 0.5, 0.02 )
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO

% TIME STEPPING
TIME_DOMAIN= NO
TIME_MARCHING= NO
CFL_NUMBER= 100
CFL_ADAPT= NO

TIME_DISCRE_FLOW= EULER_IMPLICIT
TIME_DISCRE_TURB= EULER_IMPLICIT

LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_ERROR= 1e-10
LINEAR_SOLVER_ITER= 10

% CONVERGENCE
INNER_ITER= 999999
CONV_FIELD= DRAG
CONV_STARTITER= 10
CONV_RESIDUAL_MINVAL= -14

% MESH FILE
MESH_FILENAME= NACA4412.su2
MESH_FORMAT= SU2

% OUTPUT
HISTORY_WRT_FREQ_INNER= 1
SCREEN_WRT_FREQ_INNER= 1
SURFACE_FILENAME= surface_flow
VOLUME_FILENAME= flow
CONV_FILENAME= history
TABULAR_FORMAT= CSV

OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_PARAVIEW )
OUTPUT_WRT_FREQ= ( 250, 250, 250 )