%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 configuration file
% 2D Airfoil URANS (dual-time) / Roe + MUSCL / SA turbulence
% Anti-divergence conservative setup (SU2 limiter compatible version)
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% -------------------- PROBLEM DEFINITION ------------------------------------%
SOLVER= RANS
KIND_TURB_MODEL= SA
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% -------------------- FREESTREAM --------------------------------------------%
MACH_NUMBER= 0.3
AOA= 13.0
SIDESLIP_ANGLE= 0.0

INIT_OPTION= REYNOLDS
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_TEMPERATURE= 297.78

REYNOLDS_NUMBER= 2600000
REYNOLDS_LENGTH= 1.0

FLUID_MODEL= STANDARD_AIR

% -------------------- VISCOSITY / CONDUCTIVITY ------------------------------%
VISCOSITY_MODEL= SUTHERLAND
MU_REF= 1.716E-5
MU_T_REF= 273.15
SUTHERLAND_CONSTANT= 110.4

CONDUCTIVITY_MODEL= CONSTANT_PRANDTL
PRANDTL_LAM= 0.72
PRANDTL_TURB= 0.90

% -------------------- REFERENCE VALUES --------------------------------------%
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00

REF_LENGTH= 1.0
REF_AREA= 1.0
REF_DIMENSIONALIZATION= FREESTREAM_VEL_EQ_ONE

% -------------------- BOUNDARY CONDITIONS -----------------------------------%
% 반드시 mesh의 marker 이름과 동일해야 함
MARKER_HEATFLUX= ( airfoil, 0.0 )
MARKER_FAR= ( farfield )

MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )

% -------------------- UNSTEADY / DUAL-TIME ----------------------------------%
TIME_DOMAIN= YES

% conservative physical timestep (reduce divergence / over-energetic response)
TIME_STEP= 5.0e-6

% number of physical time steps
TIME_ITER= 5000

% pseudo-time inner iterations per physical step
INNER_ITER= 100

% -------------------- NUMERICAL METHOD (FLOW) -------------------------------%
NUM_METHOD_GRAD= GREEN_GAUSS

% Roe + MUSCL (2nd order)
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES

% Most conservative limiter available in your SU2 option list
SLOPE_LIMITER_FLOW= BARTH_JESPERSEN

TIME_DISCRE_FLOW= EULER_IMPLICIT

% conservative pseudo-time CFL (fixed, no adapt)
CFL_ADAPT= NO
CFL_NUMBER= 5.0

% -------------------- NUMERICAL METHOD (TURB) -------------------------------%
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= YES
SLOPE_LIMITER_TURB= BARTH_JESPERSEN
TIME_DISCRE_TURB= EULER_IMPLICIT

% -------------------- LINEAR SOLVER -----------------------------------------%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-10
LINEAR_SOLVER_ITER= 20

% -------------------- MULTIGRID / ACCELERATION ------------------------------%
% keep off for stall/unsteady robustness
MGLEVEL= 0
MGCYCLE= V_CYCLE
MG_PRE_SMOOTH= ( 1, 1, 1, 1 )
MG_POST_SMOOTH= ( 0, 0, 0, 0 )
MG_CORRECTION_SMOOTH= ( 0, 0, 0, 0 )
MG_DAMP_RESTRICTION= 0.7
MG_DAMP_PROLONGATION= 0.7

% -------------------- OUTPUT / HISTORY --------------------------------------%
TABULAR_FORMAT= CSV
CONV_FILENAME= history

SCREEN_OUTPUT= (TIME_ITER, INNER_ITER, WALL_TIME, RMS_DENSITY, RMS_NU_TILDE, LIFT, DRAG)

% history.csv에 CL/CD 기록 (중요)
HISTORY_OUTPUT= (TIME_ITER, INNER_ITER, CUR_TIME, RMS_RES, LIFT, DRAG)

% -------------------- PARAVIEW (VTU) OUTPUT ---------------------------------%
OUTPUT_FILES= ( PARAVIEW, SURFACE_PARAVIEW )

% unsteady 즉시 확인용
OUTPUT_WRT_FREQ= 1

VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow

RESTART_FILENAME= restart_flow

% -------------------- CONVERGENCE -------------------------------------------%
CONV_FIELD= RESIDUAL
CONV_STARTITER= 50
CONV_CAUCHY_ELEMS= 200
CONV_CAUCHY_EPS= 1E-6



% -------------------- INPUT --------------------------------------------------%
MESH_FILENAME= airfoil-1.su2
MESH_FORMAT= SU2
MESH_OUT_FILENAME= mesh_out.su2
